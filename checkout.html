<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Amazon Clone - Checkout</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <div class="navbar">

            <div class="nav-logo border">

                <div class="logo"></div>

            </div>


            <div class="checkout-title">

                Checkout

            </div>


            <div class="nav-cart border">

                <i class="fa-solid fa-cart-shopping"></i>

                Cart

                <span id="cart-count">
                    0
                </span>

            </div>

        </div>

    </header>



    <!-- ==============================
         CHECKOUT
    =============================== -->

    <main class="checkout-page">


        <h1>
            Checkout
        </h1>



        <!-- ==============================
             DELIVERY ADDRESS
        =============================== -->

        <section class="checkout-section">

            <h2>
                1. Delivery Address
            </h2>


            <form id="checkout-form">

                <div class="form-group">

                    <label for="full-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="House No., Street, Area"
                        required
                    ></textarea>

                </div>


                <div class="address-row">

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            placeholder="State"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="PIN Code"
                            required
                        >

                    </div>

                </div>

            </form>

        </section>



        <!-- ==============================
             PAYMENT
        =============================== -->

        <section class="checkout-section">

            <h2>
                2. Payment Method
            </h2>


            <div class="payment-methods">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="cod"
                        checked
                    >

                    Cash on Delivery

                </label>


                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="card"
                    >

                    Credit / Debit Card

                </label>


                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="upi"
                    >

                    UPI

                </label>

            </div>

        </section>



        <!-- ==============================
             ORDER SUMMARY
        =============================== -->

        <section class="checkout-section">

            <h2>
                3. Order Summary
            </h2>


            <div id="checkout-items">

            </div>


            <div class="checkout-total">

                <strong>
                    Total:
                </strong>

                ₹<span id="checkout-total">
                    0
                </span>

            </div>


            <button
                id="place-order"
                class="place-order-btn"
            >

                Place Your Order

            </button>

        </section>


    </main>



    <script src="script.js"></script>

</body>

</html>
